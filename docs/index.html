  <body class="bg-[#F7F8F5] text-stone-900 antialiased selection:bg-emerald-900 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        if (window.location.protocol === 'file:') return;
        // Only runs when raw uncompiled /src/main.tsx failed (e.g. GitHub Pages Branch: main + / root)
        var rawEntry = document.querySelector('script[src*="/src/main.tsx"]');
        if (!rawEntry) return;
        var path = window.location.pathname || '/';
        var baseDir = path.endsWith('/')
          ? path
          : path.endsWith('.html')
          ? path.replace(/[^/]+$/, '')
          : path + '/';
        window.setTimeout(function () {
          if (window.__krishiMounted) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          fetch(baseDir + 'docs/index.html', { method: 'HEAD' })
            .then(function (res) {
              if (res.ok) {
                window.location.replace(baseDir + 'docs/' + (window.location.search || '') + (window.location.hash || ''));
                return null;
              }
              return fetch(baseDir + 'github-pages-ready/index.html', { method: 'HEAD' });
            })
            .then(function (res2) {
              if (!res2) return;
              if (res2.ok) {
                window.location.replace(
                  baseDir + 'github-pages-ready/' + (window.location.search || '') + (window.location.hash || '')
                );
              } else if (root) {
                root.innerHTML =
                  '<div style="max-width:540px;margin:48px auto;padding:24px;font-family:sans-serif;background:#fff;border:1px solid #d6d3d1;border-radius:12px">' +
                  '<h2 style="margin:0 0 8px;color:#14532d">কৃষি মিত্র (Krishi Mitra)</h2>' +
                  '<p style="margin:0 0 8px;color:#44403c;line-height:1.6">GitHub Pages-এ Settings → Pages → Branch: <b>main</b> এর সাথে Folder হিসেবে <b>/docs</b> অথবা <b>/github-pages-ready</b> সিলেক্ট করুন।</p>' +
                  '<p style="margin:0;color:#57534e;font-size:14px;line-height:1.6">অথবা মোবাইল থেকে সহজে পাবলিশ করতে শুধু <b>github-pages-ready/index.html</b> ফাইলটি রুট-এ <b>index.html</b> নামে আপলোড করুন।</p>' +
                  '</div>';
              }
            })
            .catch(function () {});
        }, 650);
      })();
    </script>
